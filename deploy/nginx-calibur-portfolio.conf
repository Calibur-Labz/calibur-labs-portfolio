# Nginx site for calibur-portfolio (Next.js standalone on 127.0.0.1:3001).
#
# Install:
#   sudo cp deploy/nginx-calibur-portfolio.conf /etc/nginx/sites-available/calibur-portfolio
#   sudo ln -s /etc/nginx/sites-available/calibur-portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d new.example.com
#
# This file listens on port 80 only; certbot adds the 443 block and the
# HTTP -> HTTPS redirect itself. Replace new.example.com with your subdomain.

# Named for this site so it can't clash with a `map $http_upgrade` the other
# project on this server may already define.
map $http_upgrade $calibur_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name new.example.com;

    client_max_body_size 10m;

    # Inherited by every location below (as long as none sets its own
    # proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite rather than append ($proxy_add_x_forwarded_for): the ORBI rate
    # limiter keys on the first hop, which must be the real client, not a
    # value the client sent.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $calibur_connection_upgrade;

    # Hashed build assets: safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # API routes: stream responses (document downloads) and allow slow AI replies.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 60s;
    }
}

# --- Main domain, after cutover ---------------------------------------------
# The app's canonical URL is https://www.caliburlabz.com (see app/layout.tsx),
# so when the main domain moves, add it to server_name above and redirect the
# other host to it. Pick ONE direction and keep NEXT_PUBLIC_SITE_URL matching.
#
# Apex -> www (matches the current canonical):
# server {
#     listen 80;
#     listen [::]:80;
#     server_name example.com;
#     return 301 https://www.example.com$request_uri;
# }
#
# www -> apex (only if you change NEXT_PUBLIC_SITE_URL to the apex):
# server {
#     listen 80;
#     listen [::]:80;
#     server_name www.example.com;
#     return 301 https://example.com$request_uri;
# }
#
# Run certbot for the redirecting host too so https:// requests to it get a
# valid certificate before the redirect:  sudo certbot --nginx -d example.com -d www.example.com
