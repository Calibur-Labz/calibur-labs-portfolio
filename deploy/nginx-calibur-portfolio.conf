# Nginx site for calibur-portfolio (Next.js standalone on 127.0.0.1:3001).
#
# Install:
#   sudo cp deploy/nginx-calibur-portfolio.conf /etc/nginx/sites-available/calibur-portfolio
#   sudo ln -s /etc/nginx/sites-available/calibur-portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d caliburlabz.com -d www.caliburlabz.com
#
# Certbot adds the 443 blocks and the HTTP -> HTTPS redirect itself. Run it for
# BOTH hosts: the apex has to present a valid certificate before it can redirect,
# or an https:// request to the apex fails at the TLS handshake and never
# reaches the 301.

# Named for this site so it can't clash with a `map $http_upgrade` the other
# project on this server may already define.
map $http_upgrade $calibur_connection_upgrade {
    default upgrade;
    ''      '';
}

# --- Apex -> www -------------------------------------------------------------
# The app's canonical origin is https://www.caliburlabz.com: it is what
# `metadataBase` resolves against, what every canonical tag points at, and what
# robots.txt declares as `Host`.
#
# This block was commented out and `server_name` still said `new.example.com`
# long after the cutover, so the apex was being served by the default site and
# answering 200 with the full application. Two hostnames serving identical
# content is duplicate content: Google has to pick a canonical host itself, link
# equity splits across the two, and the canonical tag is left arguing with a
# live 200. One 301 settles it.
#
# If the canonical ever moves to the apex, swap the two server_name values here
# and in the block below, and change NEXT_PUBLIC_SITE_URL to match — those three
# have to agree or the site redirects crawlers in a loop.
server {
    listen 80;
    listen [::]:80;
    server_name caliburlabz.com;

    return 301 https://www.caliburlabz.com$request_uri;
}

# --- Canonical host ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.caliburlabz.com;

    client_max_body_size 10m;

    # Inherited by every location below (as long as none sets its own
    # proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite rather than append ($proxy_add_x_forwarded_for): the ORBI rate
    # limiter keys on the first hop, which must be the real client, not a
    # value the client sent.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $calibur_connection_upgrade;

    # Tell browsers to come back over HTTPS without trying HTTP first. Certbot
    # redirects http:// anyway; this removes the plaintext round-trip that
    # precedes it. `always` so the header survives error responses too.
    #
    # Do not add `preload` unless you intend to submit the domain to the HSTS
    # preload list — that decision is effectively permanent.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed build assets: safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # API routes: stream responses (document downloads) and allow slow AI replies.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The admin console is per-session. Never let a cache hold it.
    location /buddhima {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 60s;

        # The public pages are prerendered (see `lib/settings.ts` — the
        # maintenance flag is read through a tagged cache rather than on every
        # request), so the HTML is safe to cache briefly at the edge. Before
        # that change every response carried `private, no-cache, no-store`.
        #
        # `stale-while-revalidate` is what makes this safe to run alongside the
        # maintenance switch: a flip is picked up on the next revalidation
        # rather than being pinned for the full max-age.
        #
        # `proxy_hide_header` first, because Next sets its own Cache-Control on
        # prerendered HTML and `add_header` would append rather than replace.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=300" always;
    }
}
