name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A push during a deploy queues behind it instead of
# cancelling it halfway through a release swap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build and release on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: bash /var/www/calibur-portfolio/repo/deploy/deploy.sh
